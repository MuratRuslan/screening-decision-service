spring:
  application:
    name: screening-decision-service

  datasource:
    url: jdbc:postgresql://localhost:5432/screening_decision
    username: screening
    password: screening

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: screening-decision-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
    listener:
      ack-mode: record
      # Micrometer Observation instrumentation for @KafkaListener invocations - this is
      # what makes consumed messages show up as spans at all.
      observation-enabled: true
    # Micrometer Observation instrumentation for KafkaTemplate.send() - matching span
    # instrumentation on the producer side.
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 100% for this task/demo so every request and Kafka message is traced; a real
      # production deployment would tune this down (head-based sampling) or switch to
      # tail-based sampling at the collector.
      probability: 1.0
  otlp:
    tracing:
      # Standard OTLP/HTTP port. No collector is bundled (TASK.md explicitly does not
      # require a full tracing backend) - point this at any OTLP-compatible collector
      # (Jaeger, Tempo, an OTel Collector) to view traces; with nothing listening here,
      # the OTel SDK's batch span processor just logs failed-export warnings in the
      # background and never blocks request/consumer processing.
      endpoint: http://localhost:4318/v1/traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  kafka:
    topics:
      cv-parsed: cv.parsed
      decision-created: screening.decision.created
      decision-dlq: screening.decision.dlq
    consumer:
      retry:
        initial-interval-ms: 500
        multiplier: 2.0
        max-interval-ms: 5000
        max-elapsed-time-ms: 30000
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
    send-timeout-ms: 5000
  precheck:
    max-concurrent-calls: 8
    timeout-ms: 2000
  semantic:
    unknown-key-policy: AUDIT

logging:
  pattern:
    level: "%5p [candidateId=%X{candidateId} eventId=%X{eventId} traceId=%X{traceId:-} spanId=%X{spanId:-}]"
