plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.24.0'
    id 'org.jsonschema2pojo' version '1.3.3'
}

group = 'kg.tunduk.test.senior'
version = '0.0.1-SNAPSHOT'
description = 'Screening decision service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// scoring/* domain records (CriterionWeight, RuleEvaluation) are Jackson-serialized
// straight into JSONB columns (rule_sets.weights, screening_decisions.rule_results) via
// Hibernate's @JdbcTypeCode(SqlTypes.JSON); Jackson needs constructor parameter names at
// runtime to (de)serialize a record by name. REST/Kafka DTOs are generated getter/setter
// POJOs instead (OpenAPI Generator / jsonschema2pojo), which don't need this.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// Spring Boot 3.5.x manages an older 1.x Testcontainers BOM by default; the
// TestcontainersConfiguration test fixture already targets the 2.x module layout
// (org.testcontainers.kafka.KafkaContainer / org.testcontainers.postgresql.PostgreSQLContainer),
// so pin the managed version explicitly rather than letting Boot's BOM downgrade it.
ext['testcontainers.version'] = '2.0.5'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'com.networknt:json-schema-validator:1.5.6'
    // Required at runtime by the OpenAPI Generator "spring" model classes'
    // JsonNullable<T> fields (tri-state absent/null/present for optional+nullable
    // contract properties, e.g. ErrorResponse.details, DecisionResponse.overrideReason).
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// --- Generated model sources -------------------------------------------------
// Both generators read directly from java-senior/contract/ (the fixed, authoritative
// contract) at build time; java-senior/ itself is never written to. Only *model*
// classes are generated - controllers/services stay hand-written.

def openApiGeneratedDir = layout.buildDirectory.dir("generated/openapi")

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/java-senior/contract/openapi.yaml"
    outputDir = openApiGeneratedDir.get().asFile.path
    apiPackage = "kg.tunduk.test.senior.screeningdecisionservice.generated.rest.api"
    modelPackage = "kg.tunduk.test.senior.screeningdecisionservice.generated.rest.model"
    invokerPackage = "kg.tunduk.test.senior.screeningdecisionservice.generated.rest.invoker"
    // Models only - no api interfaces/controllers/supporting files, since REST
    // controllers are hand-written and only need the request/response types.
    globalProperties.set(["models": ""])
    configOptions.set([
            useJakartaEe   : "true",
            dateLibrary    : "java8",
            serializationLibrary: "jackson",
            useBeanValidation: "true",
            hideGenerationTimestamp: "true"
    ])
}

def jsonSchema2PojoGeneratedDir = layout.buildDirectory.dir("generated/jsonschema2pojo")

jsonSchema2Pojo {
    source = files("$rootDir/java-senior/contract/json-schema/cv-parsed.schema.json")
    targetDirectory = jsonSchema2PojoGeneratedDir.get().asFile
    targetPackage = "kg.tunduk.test.senior.screeningdecisionservice.generated.kafka"
    dateTimeType = "java.time.Instant"
    includeJsr303Annotations = false
    generateBuilders = false
    includeGeneratedAnnotation = false
    useTitleAsClassname = true
}

sourceSets.main.java.srcDirs += [
        openApiGeneratedDir.get().asFile.path + "/src/main/java",
        jsonSchema2PojoGeneratedDir
]

compileJava.dependsOn('openApiGenerate', 'generateJsonSchema2Pojo')
