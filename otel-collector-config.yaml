# Минимальная конфигурация OTel Collector для локальной разработки: принимает
# трейсы по OTLP и выводит их в stdout контейнера (docker compose logs -f otel-collector).
# Полноценный бэкенд для трассировки (Jaeger/Tempo) не требуется по TASK.md -
# при необходимости добавьте exporter ниже и подключите его в service.pipelines.traces.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
